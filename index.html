<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lente da Tarde - Casa OS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@500;700&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-pergaminho: #0d0a07;
      --card-bg: rgba(23, 16, 11, 0.92);
      --borda-dourada: #c5a059;
      --borda-glow: rgba(197, 160, 89, 0.35);
      --sol-tarde: #e76f51;
      --texto-primario: #e8d8c8;
      --texto-dourado: #f0c987;
      --verde-elfico: #81b29a;
      --fonte-titulo: 'Cinzel Decorative', serif;
      --fonte-sub: 'Cinzel', serif;
      --fonte-corpo: 'Quicksand', sans-serif;
    }

    body {
      background-color: var(--bg-pergaminho);
      color: var(--texto-primario);
      font-family: var(--fonte-corpo);
      margin: 0;
      padding: 12px;
      display: flex;
      justify-content: center;
    }

    .card {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border: 2px solid var(--borda-dourada);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 0 15px var(--borda-glow);
      backdrop-filter: blur(8px);
    }

    h2 {
      font-family: var(--fonte-titulo);
      color: var(--sol-tarde);
      font-size: 1.15rem;
      text-align: center;
      margin-top: 0;
      border-bottom: 1px solid var(--borda-dourada);
      padding-bottom: 8px;
    }

    .radar-box {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(197, 160, 89, 0.3);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 14px;
      font-size: 0.82rem;
    }

    .bloco {
      background: rgba(0,0,0,0.3);
      border-left: 3px solid var(--sol-tarde);
      padding: 10px;
      border-radius: 0 6px 6px 0;
      margin-bottom: 12px;
    }

    .label {
      font-family: var(--fonte-sub);
      font-size: 0.78rem;
      color: var(--texto-dourado);
      margin-bottom: 6px;
      font-weight: bold;
    }

    input[type="text"] {
      width: 100%;
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--borda-dourada);
      color: var(--texto-primario);
      border-radius: 4px;
      padding: 8px;
      font-family: var(--fonte-corpo);
      font-size: 0.82rem;
      box-sizing: border-box;
    }

    .btn-grid {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .btn-st {
      flex: 1;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--borda-dourada);
      color: var(--texto-primario);
      padding: 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      font-family: var(--fonte-sub);
    }

    .btn-st.active {
      background: var(--sol-tarde);
      color: #fff;
      font-weight: bold;
    }

    .lista-tarefas {
      margin-top: 8px;
      font-size: 0.82rem;
    }

    .item-tf {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0,0,0,0.4);
      padding: 6px 8px;
      border-radius: 4px;
      margin-bottom: 4px;
      border: 1px solid rgba(197, 160, 89, 0.2);
    }

    .item-tf.concluida {
      opacity: 0.5;
      text-decoration: line-through;
    }

    .btn-salvar {
      width: 100%;
      background: linear-gradient(135deg, #c5a059, #e76f51);
      border: none;
      color: #0d0a07;
      font-family: var(--fonte-sub);
      font-weight: bold;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>☀️ Lente da Tarde — Sol do Meio-Dia</h2>

    <!-- Leitura do Radar Corporal da Tarde -->
    <div class="radar-box">
      <div style="font-family: var(--fonte-sub); color: var(--texto-dourado); font-size: 0.75rem; font-weight: bold; margin-bottom: 4px;">
        🌿 Radar Corporal (Último Registro)
      </div>
      <div id="radar-info">Carregando dados do corpo...</div>
    </div>

    <div class="bloco">
      <div class="label">⚖️ Reajuste de Rota do Ritmo</div>
      <div class="btn-grid">
        <button class="btn-st active" id="btn-manter" onclick="setAjuste('Manter Ritmo 🌿')">🌿 Manter</button>
        <button class="btn-st" id="btn-desacelerar" onclick="setAjuste('Desacelerar 🛑')">🛑 Desacelerar</button>
        <button class="btn-st" id="btn-simplificar" onclick="setAjuste('Simplificar ✂️')">✂️ Simplificar</button>
      </div>
    </div>

    <div class="bloco">
      <div class="label">⚡ Bloco de Tração da Tarde</div>
      <input type="text" id="foco-tarde" placeholder="Demanda única ou essencial da tarde..." />
    </div>

    <!-- Tarefas vindas do Planejamento Diário -->
    <div class="bloco">
      <div class="label">📋 Tarefas Alocadas para a Tarde</div>
      <div id="lista-tarefas-tarde" class="lista-tarefas">Carregando tarefas...</div>
    </div>

    <button class="btn-salvar" onclick="salvar()">🌱 Sincronizar Bloco da Tarde</button>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyD19AiSaJosyhNL8iz4J-D1mHgbu-MOKm4",
      authDomain: "planejamentos-83b23.firebaseapp.com",
      projectId: "planejamentos-83b23",
      storageBucket: "planejamentos-83b23.firebasestorage.app",
      messagingSenderId: "651538842400",
      appId: "1:651538842400:web:5d0b45e7df8f2ac1f0cd45",
      measurementId: "G-GK5XJ7FZN1"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const docId = new Date().toLocaleDateString('pt-BR').replace(/\//g, '-');
    let ajuste = "Manter Ritmo 🌿";
    let todasTarefas = [];

    // Escuta em Tempo Real do Ciclo Diário
    db.collection("ciclo_diario").doc(docId).onSnapshot(doc => {
      if(doc.exists) {
        const d = doc.data();
        if(d.focoTarde !== undefined) document.getElementById('foco-tarde').value = d.focoTarde;
        if(d.ajusteTarde) setAjusteVisual(d.ajusteTarde);
        if(d.tarefas) {
          todasTarefas = d.tarefas;
          renderizarTarefasTarde();
        }
      }
    });

    // Escuta em Tempo Real do Check-in Corporal
    db.collection("jardim_florescimento").doc("radar_funcionamento").onSnapshot(doc => {
      const container = document.getElementById('radar-info');
      if (doc.exists && doc.data().registros && doc.data().registros.length > 0) {
        const reg = doc.data().registros;
        const u = reg[reg.length - 1];
        container.innerHTML = `
          <div>Bateria: <strong style="color:var(--verde-elfico);">${u.bateria || '🟢 Regulado'}</strong> (${u.hora || ''})</div>
          <div>Tensão: ${u.corpo || 'Sem tensão'}</div>
          <div style="color:var(--sol-tarde); margin-top:2px;">Orientação: <strong>${u.acao || 'Nenhuma'}</strong></div>
        `;
      } else {
        container.innerText = "Nenhum check-in corporal registrado hoje.";
      }
    });

    function setAjuste(v) {
      ajuste = v;
      setAjusteVisual(v);
    }

    function setAjusteVisual(v) {
      ajuste = v;
      document.querySelectorAll('.btn-st').forEach(b => b.classList.remove('active'));
      if(v.includes('Desacelerar')) document.getElementById('btn-desacelerar').classList.add('active');
      else if(v.includes('Simplificar')) document.getElementById('btn-simplificar').classList.add('active');
      else document.getElementById('btn-manter').classList.add('active');
    }

    function renderizarTarefasTarde() {
      const container = document.getElementById('lista-tarefas-tarde');
      const daTarde = todasTarefas.filter(t => t.periodo === 'tarde');

      if(daTarde.length === 0) {
        container.innerHTML = '<p style="font-size:0.75rem; color:#aaa; margin:0;">Nenhuma tarefa específica para a tarde.</p>';
        return;
      }

      let html = '';
      daTarde.forEach(t => {
        html += `
          <div class="item-tf ${t.concluida ? 'concluida' : ''}">
            <input type="checkbox" ${t.concluida ? 'checked' : ''} onclick="alternarConcluida(${t.id})" />
            <span>${t.texto}</span>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    async function alternarConcluida(id) {
      todasTarefas = todasTarefas.map(t => t.id === id ? { ...t, concluida: !t.concluida } : t);
      await db.collection("ciclo_diario").doc(docId).set({ tarefas: todasTarefas }, { merge: true });
    }

    async function salvar() {
      await db.collection("ciclo_diario").doc(docId).set({
        data: new Date().toLocaleDateString('pt-BR'),
        ajusteTarde: ajuste,
        focoTarde: document.getElementById('foco-tarde').value,
        timestamp: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
      alert("✨ Bloco da Tarde Sincronizado!");
    }
  </script>
</body>
</html>
